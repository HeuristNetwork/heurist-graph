<section class="h-recordlist d-flex flex-column h-100">
  <header class="h-recordlist-toolbar d-flex flex-wrap align-items-center gap-2" data-role="toolbar">
    <label class="h-recordlist-search input-group input-group-sm" data-control="search">
      <span class="input-group-text"><i class="bi bi-search" aria-hidden="true"></i></span>
      <input class="form-control" type="search" data-role="search" autocomplete="off">
    </label>
    <label class="d-flex align-items-center gap-1" data-control="viewMode">
      <span data-role="view-label"></span>
      <select class="form-select form-select-sm h-recordlist-view-mode" data-role="view-mode">
        <option value="table" data-label="Table"></option>
        <option value="card" data-label="Cards"></option>
        <option value="row" data-label="Rows"></option>
        <option value="big" data-label="Extended"></option>
      </select>
    </label>
    <div class="dropdown" data-control="selectionActions">
      <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" data-role="selection-button"></button>
      <ul class="dropdown-menu">
        <li><button class="dropdown-item" data-selection-action="page"><i class="bi bi-check2-square me-2"></i><span data-label="Select all on page"></span></button></li>
        <li><button class="dropdown-item" data-selection-action="none"><i class="bi bi-square me-2"></i><span data-label="Select none"></span></button></li>
        <li><button class="dropdown-item" data-selection-action="show"><i class="bi bi-funnel me-2"></i><span data-label="Show selected"></span></button></li>
        <li data-collection-action><hr class="dropdown-divider"></li>
        <li data-collection-action><button class="dropdown-item" data-collection-action-name="add-selected"><i class="bi bi-bookmark-plus me-2"></i><span data-label="Add selected to collection"></span></button></li>
        <li data-collection-action><button class="dropdown-item" data-collection-action-name="add-page"><i class="bi bi-bookmarks me-2"></i><span data-label="Add page to collection"></span></button></li>
        <li data-collection-action><button class="dropdown-item" data-collection-action-name="remove-selected"><i class="bi bi-bookmark-dash me-2"></i><span data-label="Remove selected from collection"></span></button></li>
        <li data-collection-action><button class="dropdown-item" data-collection-action-name="clear"><i class="bi bi-x-square me-2"></i><span data-label="Clear collection"></span></button></li>
        <li data-collection-action><button class="dropdown-item" data-collection-action-name="show"><i class="bi bi-collection me-2"></i><span data-label="Show collection"></span></button></li>
      </ul>
    </div>
    <div class="dropdown" data-control="export">
      <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown"><i class="bi bi-download me-1"></i><span data-label="Export"></span></button>
      <ul class="dropdown-menu">
        <li><button class="dropdown-item" data-export="copy" data-label="Copy"></button></li>
        <li><button class="dropdown-item" data-export="csv" data-label="CSV"></button></li>
        <li><button class="dropdown-item" data-export="excel" data-label="Excel"></button></li>
        <li><button class="dropdown-item" data-export="pdf" data-label="PDF"></button></li>
      </ul>
    </div>
  </header>
  <div class="h-recordlist-content flex-grow-1" data-role="content"></div>
  <footer class="h-recordlist-footer d-flex align-items-center" data-control="pagination">
    <label class="d-flex align-items-center gap-1" data-control="pageSize">
      <span data-role="page-size-label"></span>
      <select class="form-select form-select-sm h-recordlist-page-size" data-role="page-size">
        <option>50</option><option>100</option><option>500</option><option>1000</option><option>5000</option>
      </select>
    </label>
    <nav class="h-recordlist-pagination" aria-label="Record list pages"><ul class="pagination pagination-sm mb-0" data-role="pagination"></ul></nav>
    <span class="h-recordlist-counter" data-role="counter" data-control="counter"></span>
  </footer>
</section>
